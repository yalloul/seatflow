spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seatflow}
    username: ${DB_USER:seatflow}
    password: ${DB_PASSWORD:seatflow_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
springdoc:
  swagger-ui:
    path: /docs
