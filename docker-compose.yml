services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatflow
      POSTGRES_USER: seatflow
      POSTGRES_PASSWORD: seatflow_local
    ports: ["55432:5432"]
    volumes: ["seatflow_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatflow"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/seatflow
      DB_USER: seatflow
      DB_PASSWORD: seatflow_local
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  seatflow_data:
